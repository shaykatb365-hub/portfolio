# Plain HTML/CSS/JS site: Netlify publishes this folder as-is (no build step).
# The only server-side code is in netlify/functions (visitor tracking + private stats).
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache images, video and fonts for a week; HTML stays fresh so updates show immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Private stats page: never indexed, never cached.
[[headers]]
  for = "/stats.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
